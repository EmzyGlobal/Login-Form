<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FORM</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <form>
      <!-- login form -->
      <h1 class="loginform">Login Form</h1>

      <div>
        <!-- mobile -->
        <input type="text" placeholder="mobile\email" />

        <input type="password" placeholder="password" />
        <a class="password"   href="#">Forgot password?</a>
        <button class="login">Login</button>
      </div>
      <!-- login option -->
      <div>
        <p class="orlogin">Or login with</p>

        <button class="ff">Facefook</button>
        <button class="fff">Instagram</button>
      </div>
      <!-- sign up option -->
      <p class="account">Don't have an account?</p>
      <a href="#">Sign up now</a>
      
    
    </form>
  </body>
</html>
